name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependency
        run: python -m pip install "pandas>=2.0"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile release scripts
        run: >-
          python -m py_compile
          ubw/temporal.py
          scripts/02_collect_multiartifact.py
          scripts/22_prepare_code_comment_release.py
          scripts/23_recover_code_comment_contexts.py
          scripts/24_validate_code_comment_release.py
          scripts/25_package_code_comment_release.py
